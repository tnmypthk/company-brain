process: security_alerts_and_account_access
display_name: Security Alerts and Account Access Management
owner: Google Account Security Team (inferred)
trigger: A security-relevant event occurs on a Google Account, such as a new sign-in,
  a new passkey being added, or a third-party application being granted data access
steps:
- Google detects a security-relevant account event (e.g., new sign-in on a new device,
  new passkey added, or third-party app access granted)
- Google sends an automated security alert email to the account holder (tpsnowflake1611@gmail.com)
  notifying them of the specific event
- The alert email presents the event details (device type, action taken, app name)
  and a direct 'Check activity' link to the Google Account security page
- Account holder reviews the activity via the provided link or at https://myaccount.google.com/notifications
- Before acting, account holder verifies the alert is genuine (sender is google.com,
  links point to myaccount.google.com) to rule out phishing
- If the activity was authorized, account holder takes no further action
- If the activity was NOT authorized, account holder clicks 'Check and secure your
  account' to initiate account recovery and lockdown (review devices, change password)
- For third-party app access (e.g., Snowflake Connector for Google Data Studio), account
  holder reviews and, if unwanted, revokes permissions via the Google Account connections
  overview
edge_cases:
- Account holder did not perform the action (unauthorized sign-in or passkey addition)
  — requires immediate account securing via the alert link
- Third-party app access was not authorized by the account holder — permissions must
  be revoked via Google Account settings
- Google cannot confirm account holder is an adult, triggering automatic restrictive
  setting changes (SafeSearch on, personalized ads off, Timeline off) requiring age
  verification to reverse
- Account holder does not respond to the security alert, leaving a potential unauthorized
  access unaddressed
- The 'security alert' is itself a phishing attempt impersonating Google — account
  holder should not click links and should navigate to myaccount.google.com directly
