process: security_alerts_and_account_access
display_name: Security Alerts and Account Access
owner: Google Account Security Team (inferred)
trigger: A notable account event occurs, such as a new passkey being added, a new
  sign-in from an unrecognized device, a third-party app being granted account access,
  or account settings being automatically changed by Google
steps:
- Google detects a security-relevant account event (e.g., new passkey added, new device
  sign-in, third-party app access granted, account settings changed)
- Google sends an automated security alert email to the account holder at the registered
  email address (tpsnowflake1611@gmail.com)
- Email describes the specific event that occurred and identifies potential risk if
  the account holder did not initiate the action
- Email provides a 'Check activity' link directing the user to their Google Account
  security notifications page (myaccount.google.com/notifications)
- User reviews the activity by clicking the provided link or visiting myaccount.google.com/notifications
- If the user did not initiate the action, they follow the 'secure your account' flow
  provided in the alert email
- If third-party app access was granted without authorization, user navigates to Google
  Account connections settings to revoke access
- If account settings were automatically changed (e.g., SafeSearch, personalized ads,
  Timeline), user may verify their age or manually adjust settings via myaccount.google.com/check-settings
edge_cases:
- Google cannot confirm the user is an adult, resulting in automatic restrictive setting
  changes (SafeSearch on, personalized ads off, Timeline off) — user must verify age
  to restore preferred settings
- A new passkey is added without the user's knowledge, indicating potential unauthorized
  account access
- A third-party connector (e.g., Snowflake Connector for Google Data Studio) is granted
  access to account data without the user's explicit authorization
- Sign-in occurs from an unrecognized device or platform (e.g., Mac) that the user
  does not recognize
- User does not act on the alert, leaving a potentially compromised account unsecured
  (inferred)
