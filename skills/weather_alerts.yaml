process: weather_alerts
display_name: Courier Weather Risk Alert Process
owner: Delivery Operations / bolt-webhooks automation
trigger: Automated n8n workflow detects adverse weather conditions (via Open-Meteo
  48-hour forecast) across monitored cities that meet or exceed configured severity
  thresholds (HEADS_UP / WARNING / URGENT)
steps:
- 1. n8n workflow polls Open-Meteo API for 48-hour weather forecasts across monitored
  cities (Tallinn, Lisbon, Warsaw, Lagos)
- 2. Rule-based engine evaluates temperature, precipitation, wind speed, and WMO weather
  codes against city-calibrated severity thresholds to assign severity level (HEADS_UP
  / WARNING / URGENT)
- 3. Check the 6-hour deduplication gate per city; if a matching alert was already
  sent within the window, suppress this one
- 4. GPT-4o-mini synthesises weather parameters into a human-readable operational
  impact summary and recommended actions; if the LLM call fails, fall back to raw
  weather data
- '5. Post a formatted Slack alert to the #weather-alerts channel including: city
  name, severity level, weather status, operational impact, and recommended actions'
- 6. Operations team reviews the Slack alert and notifies affected couriers of current
  conditions and safety guidance
- '7. Instruct couriers to take severity-appropriate action: adjust ETAs and exercise
  caution (HEADS_UP/WARNING), stay hydrated in heat, or temporarily halt deliveries
  (URGENT)'
- 8. Operations monitors delivery performance and courier check-ins in the affected
  city until conditions normalise
- 9. Send proactive customer communications about potential delays or service interruptions
  in affected areas
edge_cases:
- LLM (GPT-4o-mini) call fails — system automatically falls back to raw weather data
  for alert generation
- Thunderstorms or unsafe conditions in a city (e.g., Lagos) — deliveries may be temporarily
  halted in affected areas rather than just delayed
- Heat-related fatigue risk (e.g., Tallinn high temperatures) — courier well-being
  monitoring is triggered in addition to ETA adjustments
- Deduplication gate prevents repeated alerts for the same city within a 6-hour window
  to avoid alert fatigue
- Multiple severity levels may be active simultaneously across different cities requiring
  parallel responses
- Open-Meteo API is unreachable or returns incomplete data — handling not specified
  in draft (flagged for review)
